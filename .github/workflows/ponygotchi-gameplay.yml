name: PonyGotchi gameplay checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test gameplay and animation logic
        run: npm test
      - name: Rebuild standalone offline preview
        run: python scripts/build_preview.py
      - name: Install Chromium for browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test offline preview interactions
        run: python tests/browser-smoke.py
      - name: Publish standalone offline preview
        uses: actions/upload-artifact@v4
        with:
          name: ponygotchi-offline-preview
          path: preview-offline.html
          if-no-files-found: error
          retention-days: 14
