name: PonyGotchi full checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run browser-game logic and care-HUD tests
        run: npm test

      - name: Compile portable CrowPanel rule and layout tests
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -Wextra -Werror tests/exploration_rules_test.cpp -o /tmp/pony-exploration-test
          /tmp/pony-exploration-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/care_layout_test.cpp -o /tmp/pony-care-layout-test
          /tmp/pony-care-layout-test

      - name: Rebuild the offline preview from modular sources
        run: python scripts/build_preview.py

      - name: Install Chromium for the offline browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check offline preview interactions and browser errors
        run: python tests/browser-smoke.py

      - name: Keep visual smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ponygotchi-preview-smoke
          path: docs/preview_*.png
          if-no-files-found: ignore
