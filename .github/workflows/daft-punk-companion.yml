name: Companion checks
on:
  push:
    paths:
      - 'experiments/daft-punk-concert-companion/**'
  pull_request:
    paths:
      - 'experiments/daft-punk-concert-companion/**'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/daft-punk-concert-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
