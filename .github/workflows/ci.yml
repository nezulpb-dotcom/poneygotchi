name: PonyGotchi checks

on:
  push:
  pull_request:

jobs:
  preview-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Game logic and animation tests
        run: npm test
      - name: Build the offline HTML preview
        run: python scripts/build_preview.py
      - name: Install Playwright and Chromium for the browser smoke test
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check touch UI and browser JavaScript errors
        run: python tests/browser-smoke.py
